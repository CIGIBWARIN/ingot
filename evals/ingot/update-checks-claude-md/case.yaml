schema_version: "1.0"
name: update-checks-claude-md
description: /ingot:update's project check drops CLAUDE.md lines about folders that are gone and keeps the user's own rules.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  prompt: |
    /ingot:update I already updated everything shared today, so skip part 1 and only check this project.
