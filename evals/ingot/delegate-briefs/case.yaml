schema_version: "1.0"
name: delegate-briefs
description: A request across three projects becomes helpers whose briefs keep the work undoable and leave uncommitted work alone, and Claude checks each result itself.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Agent]
  prompt: |
    Add a thorough test suite to each of the projects in this folder, covering every module. Split the work up so it runs in parallel.
