schema_version: "1.0"
name: category-coding-promote
description: Coding rules move a style to the shared stylesheet when a second page needs it, instead of copying it.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Write, Edit]
  prompt: |
    Add a contact page to my site with a name, email and message form, shown in a card that looks like the one on the about page.
