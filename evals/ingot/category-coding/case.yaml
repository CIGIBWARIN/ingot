schema_version: "1.0"
name: category-coding
description: Coding rules keep a page's own styles with that page, so the shared stylesheet stays tokens and base styles.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Write, Edit]
  prompt: |
    Add a contact page to my site with a name, email and message form. Style the form so it looks finished.
