schema_version: "1.0"
name: category-coding-todo
description: Coding rules update the project's to-do list in the same commit as the work, not in a commit of its own.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash]
  prompt: |
    Do the first item in TODO.md and commit it.
